name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # This runs every day at midnight UTC
  workflow_dispatch: # This lets you trigger it manually if you want

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-Action@v3.4
        with:
          base_branch: main        # The branch in your fork you want to update
          target_upstream_branch: main # The branch in the original repo you are copying
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # Built-in security key
